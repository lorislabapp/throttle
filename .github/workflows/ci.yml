name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    # Independent of quality/lint: the complete app-hosted suite must always run.
    # Ad hoc Debug signing needs no distribution identity or cloud entitlement.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify the macOS evidence validator
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_macos_evidence.py' -v
      - name: Run every isolated macOS host test and verify its evidence
        run: python3 -B scripts/verify-macos-evidence.py --output-parent "$RUNNER_TEMP/throttle-macos-evidence"
      - name: Preserve exact macOS test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/throttle-macos-evidence/*/evidence/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  ios-tests:
    # The isolated companion suite runs independently of lint and macOS builds.
    # Every discovered simulator case must finish; no skip is allowed.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify the Apple test evidence validator
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_macos_evidence.py' -v
      - name: Run every isolated iOS simulator test and verify its evidence
        run: python3 -B scripts/verify-macos-evidence.py --scheme ThrottleiOS --output-parent "$RUNNER_TEMP/throttle-ios-evidence"
      - name: Preserve exact iOS simulator test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/throttle-ios-evidence/*/evidence/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  vault-tests:
    # Independent package lane: both test engines, every argument, no opt-in skip.
    # Debug package tests do not qualify signed XPC or the full Vault workflow.
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Verify the Vault evidence validator
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_vault_evidence.py' -v
      - name: Run every Vault package test and verify native evidence
        run: python3 -B scripts/verify-vault-tests.py --output-parent "$RUNNER_TEMP/throttle-vault-evidence"
      - name: Preserve exact Vault package test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vault-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/throttle-vault-evidence/*/evidence/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  validator-evidence:
    # Deliberately independent of the GUI build/lint: this subset needs no
    # signing, MLX download, local model or private research corpus.
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Test the evidence validator
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Test context failure preservation and MCP contracts
        working-directory: experiments/local-context-refinery
        run: npm test && npm run eval
      - name: Verify exact Swift validator sources and completed cases
        run: python3 scripts/verify-core-evidence.py --output-parent "$RUNNER_TEMP/throttle-core-evidence"
      - name: Print validation receipts
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "throttle-core-evidence"
          for receipt in sorted(root.glob("*/receipt.json")):
              print(receipt.read_text())
          PY

  quality:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # Every assertion below uses `grep`, never `rg`. ripgrep is NOT installed
      # on the macOS runner, and a missing binary exits 127 — which `! rg …`
      # turns into success. Five security assertions were passing because the
      # tool that would have failed them did not exist. A gate that cannot run
      # must fail loudly, so this asserts the tool it depends on.
      - name: Assert gate tooling is present
        run: |
          command -v grep >/dev/null || { echo "grep missing — gates below cannot run" >&2; exit 1; }
          command -v ruby >/dev/null || { echo "ruby missing — the ATS gate cannot run" >&2; exit 1; }
          command -v jq >/dev/null || { echo "jq missing — simulator selection cannot run" >&2; exit 1; }

      # SwiftLint is PINNED on purpose. Version 0.65.x has a baseline-generation
      # regression: a freshly written baseline cannot be read back reliably.
      # Keep the last verified compatible version until the upstream fix ships.
      - name: Install SwiftLint (pinned)
        env:
          SWIFTLINT_VERSION: 0.63.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo install -m 0755 /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          INSTALLED="$(swiftlint version)"
          if [ "$INSTALLED" != "$SWIFTLINT_VERSION" ]; then
            echo "SwiftLint $INSTALLED != pinned $SWIFTLINT_VERSION — regenerate .swiftlint-baseline.json with the pinned version" >&2
            exit 1
          fi

      - name: Generate project
        run: xcodegen generate

      - name: Validate privacy manifests
        run: |
          plutil -lint ThrottleiOS/PrivacyInfo.xcprivacy
          plutil -lint ThrottleiOSWidget/PrivacyInfo.xcprivacy
          plutil -lint ThrottleVision/PrivacyInfo.xcprivacy

      - name: Test edge agent
        working-directory: edge-agent
        run: npm test

      - name: Test shared Swift packages
        run: swift test --package-path ThrottleShared

      - name: Baseline must be repo-relative
        # A baseline regenerated under /tmp carries absolute paths; nothing matches on
        # the runner and all known violations come back as new. Fail with the cause.
        run: |
          if grep -q '"file":"\\/' .swiftlint-baseline.json; then
            echo "::error::.swiftlint-baseline.json holds absolute paths — regenerate from a worktree under \$HOME"
            exit 1
          fi

      - name: Enforce SwiftLint ratchet
        run: scripts/verify-swiftlint.sh

      # The plugin/macro validation flags mirror scripts/build-dmg.sh. mlx-swift
      # ships a `CudaBuild` build-tool plugin, and Xcode refuses to run an
      # unvalidated plugin in a non-interactive session — the build dies at
      # "Validate plug-in" before a single file compiles. The release script has
      # carried these flags for a while; this step never got them because it has
      # not executed since the linter started failing above it.
      - name: Build macOS app with hardened runtime
        run: |
          xcodebuild build \
            -project Throttle.xcodeproj \
            -scheme Throttle \
            -configuration Release \
            -destination 'platform=macOS' \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Reject accidental broad transport or runtime exceptions
        run: |
          set -euo pipefail
          # Per-target, not per-file. The macOS app REQUIRES NSAllowsArbitraryLoads:
          # NSAllowsLocalNetworking covers only .local, link-local and RFC1918, so
          # every request to a tailnet address (100.64/10) failed with -1022 before
          # a socket was opened. What must never carry it is a shipped iOS or
          # visionOS target. Grepping the whole file conflated the two and failed
          # on a correct config.
          # Ruby, not Python: PyYAML is not installed on the runner and pulling
          # it in would add a network dependency to a security gate. Ruby ships
          # with macOS and has YAML in its standard library.
          ruby -ryaml -e '
            targets = (YAML.load_file("project.yml")["targets"] || {})
            shipped = %w[iOS visionOS tvOS watchOS]
            bad = targets.select do |_, t|
              shipped.include?(t["platform"].to_s) &&
                t.dig("info", "properties", "NSAppTransportSecurity", "NSAllowsArbitraryLoads")
            end.keys
            abort("broad ATS exception on shipped target(s): #{bad.join(", ")}") unless bad.empty?
            puts "ATS: arbitrary loads confined to macOS"
          '
          sh scripts/assert-no-match.sh -REn 'NSAllowsArbitraryLoads' ThrottleiOS/Info.plist
          sh scripts/assert-no-match.sh -REn 'allow-unsigned-executable-memory|disable-library-validation' Throttle/Throttle.entitlements
          # A token VALUE, not the variable name. `throttle-ask` legitimately reads
          # THROTTLE_AGENT_TOKEN from an env file, so matching the bare name failed
          # on every script that consumes the token correctly.
          sh scripts/assert-no-match.sh -REn 'THROTTLE_AGENT_TOKEN=[A-Za-z0-9+/_-]{8,}' edge-agent ThrottleShared/Sources/ThrottleShared/EdgeAgentService.swift

      - name: Enforce App Store LAN-only boundary
        run: |
          sh scripts/assert-no-match.sh -REn 'EdgeSessionsService.swift|EdgeSessionListView.swift|EdgeTerminalView.swift' Throttle.xcodeproj/project.pbxproj
          grep -REn 'peerFallbackHost: nil' Throttle/State/AppState+Mirror.swift
          grep -REn 'edgeHost: nil' Throttle/State/AppState+Mirror.swift
          grep -REn 'edgePort: nil' Throttle/State/AppState+Mirror.swift
          grep -REn 'edgeToken: nil' Throttle/State/AppState+Mirror.swift

      - name: Enforce fail-closed release scripts
        run: |
          bash -n scripts/build-dmg.sh scripts/finalize-dmg.sh scripts/smoke-test.sh \
                  scripts/verify-public-release.sh
          # The publish path is as load-bearing as the build path: a syntax error in
          # either only shows up mid-release, after notarization.
          node --check scripts/publish-release.mjs
          python3 -m py_compile scripts/stage-release.py
          python3 scripts/tests/test_verify_public_release.py
          # stage-release must keep reading the LIVE site rather than the website
          # checkout, which drifts behind what is actually served.
          grep -q 'https://lorislab.fr/throttle' scripts/stage-release.py
          # publish-release must keep proving the deploy with the stamp, never with
          # the trigger's status code (it has returned 500 on deploys that landed).
          grep -q 'deploy-stamp.txt' scripts/publish-release.mjs
          grep -REn 'NOTARIZE=false' scripts/build-dmg.sh scripts/finalize-dmg.sh
          grep -REn -- '--notarize' scripts/build-dmg.sh scripts/finalize-dmg.sh
          sh scripts/assert-no-match.sh -REn 'mirrored — read-only|Your data never leaves your iCloud|Vos données ne quittent jamais' \
            design/appstore/make-screenshots.py design/appstore/listing.md
          grep -REn 'same local network|même réseau local' design/appstore/listing.md

      - name: Check generated and source drift
        run: git diff --check
